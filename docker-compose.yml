services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: x-narrative-tracker:local
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/x_narrative_tracker.sqlite3
      ACCOUNTS_PATH: /app/resources/accounts.json
      NARRATIVES_PATH: /app/resources/narratives.json
      SAMPLE_POSTS_PATH: /app/resources/sample_posts.json
      RSS_FEEDS_PATH: /app/resources/rss_feeds.json
      CONTENT_SOURCES_PATH: /app/config/sources.json
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8000
      TRACKER_ENABLED: ${TRACKER_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - tracker_data:/app/data
      - tracker_exports:/app/exports
      - ./config:/app/config:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  tracker_data:
  tracker_exports:
