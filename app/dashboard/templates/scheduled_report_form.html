{% extends "base.html" %}
{% block title %}{{ 'Edit' if report else 'Create' }} Scheduled Report{% endblock %}{% block heading %}{{ 'Edit' if report else 'Create' }} Scheduled Report{% endblock %}
{% block content %}
<form class="rule-editor" id="report-form"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" id="name" required value="{{ report.name if report else '' }}"></div><div class="col-md-6"><label class="form-label" for="search">Saved search</label><select class="form-select" id="search">{% for item in searches %}<option value="{{ item.id }}" {% if report and report.saved_search_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label" for="schedule-type">Schedule</label><select class="form-select" id="schedule-type"><option value="daily" {% if not report or report.schedule_type == 'daily' %}selected{% endif %}>Daily</option><option value="weekly" {% if report and report.schedule_type == 'weekly' %}selected{% endif %}>Weekly</option><option value="interval_hours" {% if report and report.schedule_type == 'interval_hours' %}selected{% endif %}>Interval hours</option></select></div><div class="col-md-4"><label class="form-label" for="schedule-value">Schedule value</label><input class="form-control" id="schedule-value" value="{{ report.schedule_value if report else '09:00' }}"></div><div class="col-md-4"><label class="form-label" for="timezone">Timezone</label><input class="form-control" id="timezone" value="{{ report.timezone if report else 'UTC' }}"></div><div class="col-md-4"><label class="form-label" for="delivery">Delivery</label><select class="form-select" id="delivery"><option value="telegram" {% if not report or report.delivery_type == 'telegram' %}selected{% endif %}>Telegram</option><option value="none" {% if report and report.delivery_type == 'none' %}selected{% endif %}>None</option></select></div><div class="col-md-4"><label class="form-label" for="destination">Destination</label><input class="form-control" id="destination" value="{{ report.destination or '' if report else '' }}"></div><div class="col-md-4"><label class="form-label" for="max-results">Maximum results</label><input class="form-control" id="max-results" type="number" min="1" max="500" value="{{ report.max_results if report else 50 }}"></div><div class="col-12 d-flex gap-4"><label><input type="checkbox" id="summary" {% if not report or report.include_summary %}checked{% endif %}> Summary</label><label><input type="checkbox" id="top-results" {% if not report or report.include_top_results %}checked{% endif %}> Top results</label><label><input type="checkbox" id="csv" {% if report and report.include_csv %}checked{% endif %}> CSV</label><label><input type="checkbox" id="enabled" {% if not report or report.enabled %}checked{% endif %}> Enabled</label></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-dark">Save</button><a class="btn btn-outline-secondary" href="/scheduled-reports">Cancel</a></div><div class="text-danger mt-3" id="error"></div></form>
<script>document.getElementById('report-form').addEventListener('submit', async (event) => { event.preventDefault(); const payload={name:name.value,saved_search_id:Number(search.value),schedule_type:document.getElementById('schedule-type').value,schedule_value:document.getElementById('schedule-value').value,timezone:timezone.value,delivery_type:delivery.value,destination:destination.value||null,include_summary:summary.checked,include_top_results:document.getElementById('top-results').checked,include_csv:csv.checked,max_results:Number(document.getElementById('max-results').value),enabled:enabled.checked}; const response=await fetch('{{ '/api/scheduled-reports/' ~ report.id if report else '/api/scheduled-reports' }}',{method:'{{ 'PUT' if report else 'POST' }}',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); if(response.ok) location.href='/scheduled-reports/'+data.id; else document.getElementById('error').textContent=data.detail; });</script>
{% endblock %}
