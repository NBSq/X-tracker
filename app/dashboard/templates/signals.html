{% extends "base.html" %}
{% block title %}Signals{% endblock %}
{% block heading %}Signals{% endblock %}
{% block content %}
<form class="filter-bar mb-4" method="get" action="/signals">
  <label>Watchlist<select class="form-select form-select-sm" name="watchlist_id"><option value="">All signals</option>{% for item in watchlists %}<option value="{{ item.id }}" {% if selected_watchlist_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
  <button class="btn btn-sm btn-dark" type="submit">Apply</button>
  <a class="btn btn-sm btn-outline-secondary" href="/signals">Clear</a>
</form>
<section class="dashboard-section">
  <div class="section-heading"><h2>Latest signal history</h2><span class="section-meta">Newest first</span></div>
  <div class="table-responsive">
    <table class="table signal-table align-middle mb-0">
      <thead><tr><th>Signal</th><th>Type</th><th>Hype</th><th>Momentum</th><th>Confidence</th><th>Action</th><th>Outcome</th></tr></thead>
      <tbody id="signals-body">{% include "partials/signal_rows.html" %}</tbody>
    </table>
  </div>
</section>
{% endblock %}
