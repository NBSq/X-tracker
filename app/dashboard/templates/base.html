<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Overview{% endblock %} | x-narrative-tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='/dashboard.css') }}" rel="stylesheet">
</head>
<body data-page="{{ page }}">
  <header class="app-header border-bottom">
    <nav class="navbar navbar-expand-lg" aria-label="Primary navigation">
      <div class="container-fluid app-shell">
        <a class="navbar-brand" href="/">
          <span class="brand-mark" aria-hidden="true">XN</span>
          <span>x-narrative-tracker</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <div class="navbar-nav ms-auto">
            <a class="nav-link {% if page == 'overview' %}active{% endif %}" href="/">Overview</a>
            <a class="nav-link {% if page == 'signals' %}active{% endif %}" href="/signals">Signals</a>
            <a class="nav-link {% if page == 'performance' %}active{% endif %}" href="/performance">Performance</a>
            <a class="nav-link {% if page == 'history' %}active{% endif %}" href="/history">History</a>
            <a class="nav-link {% if page == 'outcomes' %}active{% endif %}" href="/outcomes">Outcomes</a>
            <a class="nav-link {% if page == 'narratives' %}active{% endif %}" href="/narratives">Narratives</a>
            <a class="nav-link {% if page == 'tokens' %}active{% endif %}" href="/tokens">Tokens</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="app-shell py-4">
    <div class="page-heading d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
      <div>
        <p class="eyebrow mb-1">Analytics dashboard</p>
        <h1 class="h3 mb-0">{% block heading %}Overview{% endblock %}</h1>
      </div>
      <div class="system-state" aria-live="polite">
        <span class="status-dot"></span>
        <span id="system-status">{{ (status or data.status).status|capitalize }}</span>
        <span class="refresh-time" id="refresh-time">Live</span>
      </div>
    </div>
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', path='/dashboard.js') }}"></script>
</body>
</html>
