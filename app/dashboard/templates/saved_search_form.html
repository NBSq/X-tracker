{% extends "base.html" %}
{% block title %}{{ 'Edit' if saved_search else 'Create' }} Saved Search{% endblock %}{% block heading %}{{ 'Edit' if saved_search else 'Create' }} Saved Search{% endblock %}
{% block content %}
<form class="rule-editor" id="search-form">
<div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" id="name" required maxlength="120" value="{{ saved_search.name if saved_search else '' }}"></div><div class="col-md-6"><label class="form-label" for="target">Target</label><select class="form-select" id="target">{% for value in ['signals','unified_events','narratives','tokens','graph_relationships','quality_signals'] %}<option value="{{ value }}" {% if saved_search and saved_search.target_type == value %}selected{% endif %}>{{ value|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label" for="description">Description</label><input class="form-control" id="description" maxlength="1000" value="{{ saved_search.description if saved_search else '' }}"></div><div class="col-12"><label class="form-label" for="filters">Filters</label><textarea class="form-control font-monospace" id="filters" rows="8">{{ saved_search.filters|tojson(indent=2) if saved_search else '{}' }}</textarea></div><div class="col-md-4"><label class="form-label" for="sort">Sort by</label><input class="form-control" id="sort" value="{{ saved_search.sort_by if saved_search else 'created_at' }}"></div><div class="col-md-4"><label class="form-label" for="direction">Direction</label><select class="form-select" id="direction"><option value="desc" {% if not saved_search or saved_search.sort_direction == 'desc' %}selected{% endif %}>Descending</option><option value="asc" {% if saved_search and saved_search.sort_direction == 'asc' %}selected{% endif %}>Ascending</option></select></div><div class="col-md-4"><label class="form-label" for="limit">Result limit</label><input class="form-control" id="limit" type="number" min="1" max="500" value="{{ saved_search.result_limit if saved_search else 50 }}"></div><div class="col-12 form-check ms-2"><input class="form-check-input" id="enabled" type="checkbox" {% if not saved_search or saved_search.enabled %}checked{% endif %}><label class="form-check-label" for="enabled">Enabled</label></div></div>
<div class="d-flex gap-2 mt-4"><button class="btn btn-dark" type="submit">Save</button><a class="btn btn-outline-secondary" href="/saved-searches">Cancel</a></div><div class="text-danger mt-3" id="error"></div>
</form>
<script>document.getElementById('search-form').addEventListener('submit', async (event) => { event.preventDefault(); const error=document.getElementById('error'); try { const payload={name:name.value,description:description.value,target_type:target.value,filters:JSON.parse(filters.value),sort_by:sort.value,sort_direction:direction.value,result_limit:Number(limit.value),enabled:enabled.checked}; const response=await fetch('{{ '/api/saved-searches/' ~ saved_search.id if saved_search else '/api/saved-searches' }}',{method:'{{ 'PUT' if saved_search else 'POST' }}',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); if(!response.ok) throw new Error(data.detail); location.href='/saved-searches/'+data.id; } catch (e) { error.textContent=e.message; }});</script>
{% endblock %}
