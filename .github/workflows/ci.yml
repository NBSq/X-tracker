name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag x-narrative-tracker:ci .

      - name: Verify non-root image user
        run: test "$(docker run --rm x-narrative-tracker:ci id -u)" = "10001"

      - name: Start offline container
        run: |
          docker run --detach --name x-narrative-tracker-ci \
            --publish 8000:8000 \
            --env TRACKER_ENABLED=false \
            --env AI_PROVIDER=mock \
            --env OPENAI_API_KEY= \
            --env TELEGRAM_BOT_TOKEN= \
            --env TELEGRAM_CHAT_ID= \
            x-narrative-tracker:ci

      - name: Verify readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs x-narrative-tracker-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm --force x-narrative-tracker-ci || true
